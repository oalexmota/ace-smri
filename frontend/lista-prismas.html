<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Prismas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="icon" type="image/png" href="img/logo-prefeitura.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/auth.js"></script>
</head>

<body>
  <div class="container py-4">
    <div class="mb-4">
      <h1 class="titulo-pagina mb-1">Lista de Prismas</h1>
      <p class="text-muted mb-0">Consulta, busca, edição, remoção e impressão individual</p>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="buscaTexto" class="form-label">Buscar</label>
            <input type="text" id="buscaTexto" class="form-control" placeholder="Busque por nome, cargo ou empresa" />
          </div>

          <div class="col-md-2">
            <label for="filtroTipoPrisma" class="form-label">Tipo</label>
            <select id="filtroTipoPrisma" class="form-select">
              <option value="">Todos</option>
              <option value="pequeno">Prisma pequeno</option>
              <option value="grande">Prisma grande</option>
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Data de criação</label>
            <div class="row g-1 align-items-center">
              <div class="col">
                <input type="date" id="filtroData" class="form-control" title="De" />
              </div>
              <div class="col-auto">
                <span class="text-muted small px-1">até</span>
              </div>
              <div class="col">
                <input type="date" id="filtroDataAte" class="form-control" title="Até" />
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="button" id="btnBuscarPrismas" class="btn btn-danger">
            Buscar
          </button>
          <button type="button" id="btnLimparBusca" class="btn btn-outline-secondary">
            Limpar filtros
          </button>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h2 class="h5 mb-0">Prismas armazenados</h2>

          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span id="contadorSelecionados" class="badge bg-secondary">0 selecionados</span>
            <button type="button" id="btnLimparSelecao" class="btn btn-sm btn-outline-secondary">
              Limpar seleção
            </button>
            <button type="button" id="btnExcluirSelecionados" class="btn btn-sm btn-outline-danger">
              Excluir selecionados
            </button>
            <button type="button" id="btnImprimirSelecionados" class="btn btn-sm btn-outline-success">
              Imprimir selecionados
            </button>
            <span id="contadorPrismasBanco" class="badge bg-dark">0</span>
          </div>
        </div>

        <div id="listaPrismasBanco">
          <p class="text-muted mb-0">Nenhum prisma encontrado.</p>
        </div>
      </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="home-footer mt-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div><strong>ACE</strong> — Aplicação de Controle Exclusivo &nbsp;·&nbsp; SMRI</div>
        <div class="home-footer-texto">
          © <strong>2026</strong> Todos os direitos reservados.
        </div>
      </div>
    </footer>
  </div>

  <!-- Confirm Modal -->
  <style>
    .ace-modal-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1050;align-items:center;justify-content:center}
    .ace-modal-bd.open{display:flex}
    .ace-confirm-box{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:340px;box-shadow:0 10px 32px rgba(0,0,0,.18);text-align:center}
    .ace-confirm-box h3{font-size:.98rem;font-weight:700;margin-bottom:.5rem;color:#1f2937}
    .ace-confirm-box p{font-size:.84rem;color:#6b7280;margin-bottom:1.1rem}
  </style>
  <div class="ace-modal-bd" id="aceConfirmBd">
    <div class="ace-confirm-box">
      <h3 id="aceConfirmTitulo">Confirmar</h3>
      <p id="aceConfirmTexto"></p>
      <div class="d-flex gap-2 justify-content-center">
        <button class="btn btn-sm btn-outline-secondary" onclick="_aceConfirmClose()">Cancelar</button>
        <button class="btn btn-sm btn-danger" onclick="_aceConfirmOk()">Remover</button>
      </div>
    </div>
  </div>

  <script src="js/lista-prismas.js"></script>
  <script>(async()=>{const u=await ACE_AUTH.check();if(!u)return;ACE_AUTH.renderNavbar('Lista de Prismas');})();</script>
</body>

</html>
