<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="img/logo-prefeitura.png"/>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background: #dde9f7;
         font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:1rem}

    .login-card{background:#fff;border-radius:20px;padding:2.5rem 2.25rem 2rem;
                width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.35)}

    /* Logo área */
    .logo-area{text-align:center;margin-bottom:2rem}
    .logo-img{width:124px;height:124px;object-fit:contain;margin-bottom:-0.1rem;
              filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
    .logo-title{font-size:1.35rem;font-weight:800;color:#1f2937;letter-spacing:-.3px;margin:0}
    .logo-sub{font-size:.78rem;color:#9ca3af;font-weight:500;margin-top:2px}

    /* Form */
    .flabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
            color:#6b7280;margin-bottom:.3rem;display:block}
    .finput{width:100%;padding:.55rem .85rem;border:1.5px solid #e5e7eb;border-radius:10px;
            font-size:.95rem;outline:none;transition:border .15s,box-shadow .15s;background:#fafafa}
    .finput:focus{border-color:#374151;box-shadow:0 0 0 3px rgba(55,65,81,.1);background:#fff}
    .finput::placeholder{color:#d1d5db}

    /* Hint */
    .hint{font-size:.73rem;color:#9ca3af;margin-top:.4rem}
    .hint strong{color:#6b7280}

    /* Button */
    .btn-login{width:100%;background:#e30613;color:#fff;border:none;border-radius:10px;
               padding:.65rem;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:1.4rem;
               transition:background .14s,transform .1s;letter-spacing:.2px}
    .btn-login:hover{background:#b30510}
    .btn-login:active{transform:scale(.98)}
    .btn-login:disabled{background:#9ca3af;cursor:not-allowed}

    /* Error */
    .error-box{background:#fee2e2;border:1px solid #fecaca;border-radius:9px;
               padding:.55rem .85rem;font-size:.82rem;color:#b91c1c;font-weight:600;
               display:none;margin-top:.9rem;text-align:center}
    .error-box.show{display:block}

    /* Footer */
    .login-footer{text-align:center;margin-top:1.5rem;font-size:.72rem;color:#9ca3af}
  </style>
</head>
<body>
<div class="login-card">

  <!-- Logo -->
  <div class="logo-area">
    <img src="img/logo_assinatura.png" alt="Prefeitura de São Paulo" class="logo-img"
         onerror="this.style.display='none'"/>
    <h1 class="logo-title">ACE</h1>
    <p class="logo-sub">Secretaria Municipal de Relações Internacionais</p>
  </div>

  <!-- Form -->
  <form id="loginForm" onsubmit="doLogin(event)" autocomplete="off">
    <div style="margin-bottom:1.1rem">
      <label class="flabel" for="inpUser">Usuário</label>
      <input id="inpUser" type="text" class="finput" placeholder="Ex: d123456"
             autocomplete="username" autocapitalize="none" spellcheck="false" required/>
      <p class="hint">Digite o código do seu usuário de rede.<br>
        Exemplo: <strong>d123456</strong></p>
    </div>

    <div id="senhaWrap" style="display:none;margin-bottom:1.1rem">
      <label class="flabel" for="inpSenha">Senha</label>
      <input id="inpSenha" type="password" class="finput" placeholder="••••••••"
             autocomplete="current-password"/>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    <div class="error-box" id="errBox"></div>
  </form>

  <div class="login-footer">
    Acesso restrito ao pessoal da SMRI · Uso interno
  </div>
</div>

<script>
  let _requiresPassword = false;

  /* Verifica se senha é exigida e mostra o campo se sim */
  (async () => {
    try {
      const r = await fetch("/api/auth/config");
      const j = await r.json();
      if (j.requiresPassword) {
        _requiresPassword = true;
        document.getElementById("senhaWrap").style.display = "";
      }
    } catch(e) { /* ignora — assume sem senha */ }
  })();

  /* Se já tem sessão válida, redireciona direto */
  (async () => {
    const token = localStorage.getItem("ace_token");
    if (!token) return;
    try {
      const r = await fetch("/api/auth/me", { headers: { Authorization: `Bearer ${token}` } });
      const j = await r.json();
      if (j.sucesso) window.location.replace("/");
    } catch(e) { /* continua na tela de login */ }
  })();

  async function doLogin(e) {
    e.preventDefault();
    const btn   = document.getElementById("btnLogin");
    const err   = document.getElementById("errBox");
    const user  = document.getElementById("inpUser").value.trim();
    const senha = document.getElementById("inpSenha").value;

    if (!user) return;
    btn.disabled = true;
    btn.textContent = "Entrando…";
    err.classList.remove("show");

    try {
      const body = { username: user };
      if (_requiresPassword) body.senha = senha;

      const res = await fetch("/api/auth/login", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(body)
      });
      const json = await res.json();

      if (!json.sucesso) throw new Error(json.mensagem || "Usuário não encontrado.");

      localStorage.setItem("ace_token", json.token);
      localStorage.setItem("ace_user",  JSON.stringify(json.user));
      window.location.replace("/");

    } catch(ex) {
      err.textContent = ex.message;
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Entrar";
      document.getElementById("inpUser").focus();
    }
  }
</script>
</body>
</html>
